openapi: 3.0.0
info:
  title: SchoolOS Backend API
  description: API Documentation for SchoolOS Nepal SaaS Platform
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local server
paths:
  /auth/login:
    post:
      summary: User Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: admin@bmss.edu.np
                password:
                  type: string
                  example: SchoolPass123
                subdomain:
                  type: string
                  example: bmss
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '401':
          description: Invalid credentials
  
  /auth/me:
    get:
      summary: Get Current User Profile
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
